# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 설정 — 한국어 리뷰 + 프로젝트 가드레일 반영
language: "ko-KR"
tone_instructions: "간결하고 친근하게, 핵심부터. 사소한 스타일 지적보다 버그·보안·아키텍처를 우선한다."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true # PR 상단 변경 요약
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false # Draft PR은 리뷰 안 함
    base_branches:
      - "main"
      - "dev"
  # 리뷰에서 제외할 경로 (자동 생성물·바이너리·정적 자산)
  path_filters:
    - "!**/*.svg"
    - "!public/**"
    - "!**/*.lock"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!next-env.d.ts"
    - "!.next/**"
  # 경로별 리뷰 지침 — 프로젝트 핵심 규칙을 리뷰어에게 주입
  path_instructions:
    - path: "app/**"
      instructions: >-
        Next.js App Router. LLM(Gemini)과 카카오 로컬 REST 호출은 반드시 서버
        (Server Action 또는 Route Handler)에서만 일어나야 한다. 서버 키
        (GEMINI_API_KEY, KAKAO_REST_API_KEY)에 NEXT_PUBLIC_ 접두사가 붙거나
        클라이언트 번들로 새는 코드가 있으면 강하게 지적할 것.
    - path: "lib/**"
      instructions: >-
        코스 엔진 로직. 환각 방지가 핵심 규칙: LLM은 제공된 후보 place_id 중에서만
        장소를 골라야 하고, 이름·좌표·링크는 LLM 출력이 아니라 카카오 데이터에서
        place_id로 조인해 사용해야 한다. LLM이 돌려준 place_name을 신뢰해 렌더에
        쓰는 코드가 있으면 지적할 것.
    - path: "components/**"
      instructions: >-
        클라이언트 컴포넌트. 카카오맵 SDK는 JavaScript 키(NEXT_PUBLIC_KAKAO_JS_KEY)만
        쓴다. 색은 하드코딩 대신 globals.css의 토큰(--brand 등)을 쓰고, 라이트/다크
        양쪽에서 동작하는지 본다. 접근성(버튼 aria-label, 대비)도 가볍게 체크.

chat:
  auto_reply: true
